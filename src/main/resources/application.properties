spring.application.name=backend_ai_interview
server.port=8081

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB


# OpenAI Configuration
# openai.api.key=your-openai-api-key

# Whisper Model Configuration
# Pilih: "openai" atau "faster-whisper"
# whisper.model=openai

# Faster-Whisper Configuration (jika menggunakan local faster-whisper)
# faster-whisper.endpoint=http://localhost:8000

# Swagger/OpenAPI Configuration
# springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.layout=StandaloneLayout


# Gemini Configuration (can be overridden via env: GEMINI_API_KEY, GEMINI_MODEL)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
url_gemini=${URL_GEMINI:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# STT Configuration (can be overridden via env: STT_URL)
stt.url=${STT_URL:http://127.0.0.1:8000/media/transcribe}

# MongoDB Configuration (DISABLED by default to avoid connection errors)
# MongoDB is optional and only used for storing assessment results
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration}
